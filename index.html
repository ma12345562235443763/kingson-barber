<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King'son Barber - Promo 2x1</title>
    <style>
        /* 1. DOCUMENTACIÓN: Configuración visual del fondo */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            /* Se utiliza tu imagen JPG como fondo general */
            background: url("unnamed 2222.JPG") no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Capa oscura para asegurar que el texto sea legible sobre la foto */
        .overlay {
            background: rgba(0, 0, 0, 0.82);
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. DOCUMENTACIÓN: Estilo del logo circular */
        .logo-img {
            width: 140px;
            height: 140px;
            border-radius: 50%; /* Transforma la imagen en círculo */
            object-fit: cover;
            border: 3px solid #d4af37; /* Borde dorado */
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* Estilo para la imagen del título promocional */
        .titulo-img {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Caja contenedora de la promoción */
        .promo-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px); /* Efecto de vidrio esmerilado */
            border: 1px solid #d4af37;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
        }

        /* 3. DOCUMENTACIÓN: Estilos de los botones */
        .btn {
            text-decoration: none;
            padding: 16px 25px;
            border-radius: 50px;
            font-weight: bold;
            display: block;
            margin: 15px auto;
            transition: transform 0.2s ease;
            max-width: 280px;
        }

        .btn:active { transform: scale(0.95); }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        footer {
            margin-top: auto;
            padding-top: 30px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <!-- Logo de la barbería -->
        <img src="logo 2.png" alt="Logo King'son Barber" class="logo-img">

        <!-- Imagen del título/flyer promocional -->
        <img src="tiulo 222.jfif" alt="Promoción 2x1" class="titulo-img">

        <div class="promo-box">
    <h2 style="color: #d4af37; margin: 0 0 15px 0;">PROMO EXCLUSIVA</h2>
    
    <!-- SECCIÓN: LA COLONIA UNIDOS -->
    <div style="margin-bottom: 25px;">
        <p>
            <strong>Jugador de La Colonia Unidos</strong><br>
            Corte = $5000
        </p>
        <a href="https://wa.me/5492634358078?text=Hola!%20Soy%20de%20La%20Colonia%20unidos%2C%20quiero%20el%20turno%20de%20la%20promo%20de%20%245000" class="btn btn-whatsapp">
            RESERVAR UNIDOS ✂️
        </a>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(212, 175, 55, 0.3); margin: 20px 0;">

    <!-- SECCIÓN: LA COLONIA FUT SAL -->
    <div style="margin-bottom: 25px;">
        <p>
            <strong>La Colonia Futsal</strong><br>
            Corte = $5000
        </p>
        <a href="https://wa.me/5492634358078?text=Hola!%20Soy%20de%20La%20Colonia%20futsal%2C%20quiero%20el%20turno%20de%20la%20promo%20de%20%245000" class="btn btn-whatsapp">
            RESERVAR FUTSAL ✂️
        </a>
    </div>

    <!-- Botón de Instagram (General) -->
    <a href="https://www.instagram.com/king.son_barber" target="_blank" class="btn btn-instagram">
        SÍGUENOS EN INSTAGRAM
    </a>
</div>

        <footer>
            King'son Barber &copy; 2026 | Mendoza, Argentina <br>
            Desarrollado para Santino Franco Gilberto
        </footer>
    </div>

</body>
</html>
